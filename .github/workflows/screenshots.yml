name: UI Screenshots
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/screenshots.yml'
permissions:
  contents: write
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Record screenshots
        run: ./gradlew recordRoborazziDebug --console=plain
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-reports
          path: |
            app/build/reports/
            app/build/test-results/
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: app/screenshots/*.png
          if-no-files-found: ignore
      - name: Commit screenshots
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p docs/screenshots
          cp app/screenshots/*.png docs/screenshots/
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update UI screenshots [skip ci]"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: earphonealarm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # 고정 서명키가 저장소 Secrets에 있으면 업데이트 설치가 되는 릴리스 APK도 만든다.
      - name: Build signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        if: env.HAS_RELEASE_KEY == 'true'
        with:
          name: earphonealarm-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          APK=app/build/outputs/apk/release/app-release.apk; [ -f "$APK" ] || APK=app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" earphonealarm.apk
          TAG="v$VERSION"
          NOTES="$(git log -1 --pretty=%s)"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" earphonealarm.apk --clobber; gh release edit "$TAG" --latest; else gh release create "$TAG" earphonealarm.apk --target "$GITHUB_SHA" --title "이어폰 알람 $VERSION" --notes "$NOTES" --latest; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
